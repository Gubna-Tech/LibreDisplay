name: Publish LibreDisplay container

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release identity
        shell: bash
        run: |
          set -euo pipefail
          test "v$(cat VERSION | tr -d '\r\n')" = "$GITHUB_REF_NAME"
          test -f docker/Dockerfile
          test -f app/dashboard_server.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Linux AMD64 and ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gubna-tech/libredisplay:${{ github.ref_name }}
      - name: Check registry manifest
        env:
          IMAGE: ghcr.io/gubna-tech/libredisplay:${{ github.ref_name }}
        run: |
          # The default first GHCR publish can be private. Fail until anonymous
          # pulls work; a successful authenticated inspection is not enough.
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker buildx imagetools inspect "$IMAGE"
          echo "Anonymous manifest access verified for $IMAGE"
