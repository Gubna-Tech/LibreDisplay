name: libredisplay

services:
  libredisplay:
    image: "${LIBREDISPLAY_IMAGE:-ghcr.io/gubna-tech/libredisplay:v1.16.4}"
    container_name: libredisplay
    restart: unless-stopped
    init: true
    user: "${DASHBOARD_UID:-10001}:${DASHBOARD_GID:-10001}"
    ports:
      - "${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-8787}:8787"
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8787
      DASHBOARD_DATA_DIR: /data
      DASHBOARD_MEDIA_ROOTS: /media
      DASHBOARD_REMOTE_ENABLED: ${DASHBOARD_REMOTE_ENABLED:-1}
      DASHBOARD_REMOTE_NETWORKS: ${DASHBOARD_REMOTE_NETWORKS:-private}
      DASHBOARD_REMOTE_SESSION_SECONDS: ${DASHBOARD_REMOTE_SESSION_SECONDS:-28800}
      DASHBOARD_DISPLAY_SESSION_SECONDS: ${DASHBOARD_DISPLAY_SESSION_SECONDS:-31536000}
      DASHBOARD_ALLOWED_HOSTS: ${DASHBOARD_ALLOWED_HOSTS:-}
      DASHBOARD_CACHE_MAX_BYTES: ${DASHBOARD_CACHE_MAX_BYTES:-536870912}
    volumes:
      - "${LIBREDISPLAY_DATA_SOURCE:-libredisplay-data}:/data"
      - "${LIBREDISPLAY_MEDIA_SOURCE:-libredisplay-media}:/media:ro"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  libredisplay-data:
  libredisplay-media:
